<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бридж Рубика — онлайн тест</title><style>
:root{--bg:#0b1416;--panel:#172428;--panel2:#20343a;--text:#f7faf9;--muted:#9db2b7;--gold:#f2c55f;--green:#1d5749;--red:#d34a55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#183239,#081012 62%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:12px}.panel{background:rgba(23,36,40,.95);border-radius:18px;padding:16px}.hidden{display:none!important}.btn{border:0;border-radius:12px;padding:10px 14px;background:#324a51;color:#fff;font-weight:900;cursor:pointer}.btn.gold{background:var(--gold);color:#251e0c}.btn.green{background:#54d59c;color:#09271b}.btn:disabled{opacity:.35;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}.field{background:#102025;border:1px solid #395259;color:#fff;border-radius:11px;padding:10px 12px;min-width:0}.hero{max-width:620px;margin:50px auto}.hero h1{margin:0 0 8px}.tabs{display:flex;gap:8px;margin:18px 0}.hint{color:var(--muted);font-size:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.code{font-size:28px;letter-spacing:4px;color:var(--gold);font-weight:1000}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px}.player{background:#20343a;border-radius:13px;padding:10px}.player.active{outline:3px solid var(--gold)}.table{position:relative;margin-top:10px;min-height:620px;padding:18px;border:8px solid #705237;border-radius:36px;background:radial-gradient(ellipse at center,#28614f,#123a31 72%);overflow:hidden}.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:120px}.opp{text-align:center}.backs{display:flex;justify-content:center;margin-top:6px}.back{width:42px;height:62px;border:3px solid #e6d9a8;border-radius:8px;background:repeating-linear-gradient(45deg,#8e2941 0 6px,#bd3b59 6px 12px);margin-left:-22px}.back:first-child{margin-left:0}.center{display:flex;justify-content:center;gap:34px;align-items:flex-start;margin:22px 0 160px}.pileWrap{text-align:center}.pile{width:86px;height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center}.deck{background:repeating-linear-gradient(45deg,#244b83 0 8px,#3263a8 8px 16px);border:3px solid #b8d0da;font-size:31px;font-weight:1000}.card{width:86px;height:120px;border-radius:12px;background:#fffdf4;color:#101010;border:3px solid #e6dfcd;padding:7px;display:flex;flex-direction:column;justify-content:space-between;font-weight:1000}.red{color:#c72f3c}.rank{font-size:24px}.suit{font-size:35px;text-align:center}.mini{text-align:right}.series{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:7px}.miniCard{padding:4px 7px;border-radius:7px;background:#fff;color:#111;font-weight:900}.me{position:absolute;left:10px;right:10px;bottom:12px}.hand{display:flex;justify-content:center;align-items:flex-end;overflow-x:auto;min-height:130px;padding:8px}.hand .card{flex:0 0 72px;width:72px;height:104px;margin-left:-17px;opacity:.55}.hand .card:first-child{margin-left:0}.hand .card.legal{opacity:1;transform:translateY(-10px);outline:4px solid rgba(242,197,95,.7);cursor:pointer}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.status{text-align:center;background:#20343a;border-radius:13px;padding:10px;margin:10px 0;font-weight:900}.ordered{display:inline-flex;padding:6px 10px;border-radius:10px;background:#fff;color:#111;font-weight:1000;margin-top:7px}.log{max-height:180px;overflow:auto;margin-top:10px;background:#172428;border-radius:14px;padding:10px}.log div{padding:4px;border-bottom:1px solid rgba(255,255,255,.06)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(520px,100%);background:#172428;border-radius:20px;padding:20px}.summary{display:grid;grid-template-columns:1fr auto;gap:7px 14px;background:#20343a;padding:12px;border-radius:12px}.error{color:#ff969e;font-weight:800;margin-top:8px}.lobbyList{margin:12px 0;display:grid;gap:7px}.lobbyRow{background:#20343a;padding:10px;border-radius:10px;display:flex;justify-content:space-between}@media(max-width:700px){.table{min-height:670px;padding:10px;border-width:6px}.opps{gap:2px}.back{width:34px;height:52px;margin-left:-22px}.center{margin-bottom:190px;gap:14px}.pile,.card{width:74px;height:104px}.hand .card{flex-basis:65px;width:65px;height:96px}.code{font-size:22px}.hero{margin:15px auto}}
</style></head><body><div class="wrap">
<div id="home" class="panel hero"><h1>🃏 Бридж Рубика — онлайн тест</h1><div class="hint">Создай комнату или зайди по коду. Для теста без регистрации.</div><div class="tabs"><button class="btn gold" id="createTab">Создать</button><button class="btn" id="joinTab">Войти</button></div><div id="createBox"><div class="row"><input id="createName" class="field grow" placeholder="Твой ник" value="Рубик"><select id="seats" class="field"><option value="2">2 игрока</option><option value="3">3 игрока</option><option value="4">4 игрока</option></select><button class="btn green" id="createBtn">Создать комнату</button></div></div><div id="joinBox" class="hidden"><div class="row"><input id="joinName" class="field grow" placeholder="Твой ник"><input id="roomCode" class="field" placeholder="КОД" maxlength="6"><button class="btn green" id="joinBtn">Войти</button></div></div><div id="homeErr" class="error"></div></div>
<div id="lobby" class="panel hidden"><div class="top"><div><div class="hint">Код комнаты</div><div class="code" id="lobbyCode"></div></div><div><div class="hint">Отправь друзьям эту ссылку</div><input id="shareLink" class="field" style="min-width:320px" readonly></div></div><div class="lobbyList" id="lobbyPlayers"></div><div class="row"><button id="startBtn" class="btn gold hidden">Начать игру</button><span class="hint" id="lobbyHint"></span></div></div>
<div id="game" class="hidden"><div class="players" id="scoreboard"></div><div class="status" id="status"></div><div class="table"><div class="opps" id="opps"></div><div class="center"><div class="pileWrap"><div class="pile deck" id="deckCount">0</div><div class="hint">добор</div></div><div class="pileWrap"><div id="topCard"></div><div class="hint">верхняя карта</div><div id="series" class="series"></div><div id="orderedSuit"></div></div></div><div class="me"><div><b>😎 <span id="myName"></span></b></div><div id="hand" class="hand"></div><div class="controls"><button id="endBtn" class="btn gold">Закончить действие</button><button id="drawBtn" class="btn">Добрать</button></div></div></div><div class="log" id="log"></div></div>
</div>
<div id="decision" class="overlay hidden"><div class="modal"><h2 id="decisionTitle"></h2><div id="decisionBody"></div></div></div>
<script>
const S={room:null,token:null,state:null,poll:null};const $=id=>document.getElementById(id);const sym={H:'♥',D:'♦',C:'♣',S:'♠'};function rank(c){return c.slice(0,-1)}function suit(c){return c.slice(-1)}function red(c){return 'HD'.includes(suit(c))}function card(c,cls=''){return `<div class="card ${red(c)?'red':''} ${cls}"><div class="rank">${rank(c)}</div><div class="suit">${sym[suit(c)]}</div><div class="mini">${rank(c)}${sym[suit(c)]}</div></div>`}async function api(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Ошибка');return j}function show(id){['home','lobby','game'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function err(msg){$('homeErr').textContent=msg||''}
$('createTab').onclick=()=>{$('createBox').classList.remove('hidden');$('joinBox').classList.add('hidden')};$('joinTab').onclick=()=>{$('joinBox').classList.remove('hidden');$('createBox').classList.add('hidden')};$('createBtn').onclick=async()=>{try{err('');const j=await api('/api/create',{name:$('createName').value,seats:+$('seats').value});enter(j.room,j.token)}catch(e){err(e.message)}};$('joinBtn').onclick=async()=>{try{err('');const j=await api('/api/join',{room:$('roomCode').value,name:$('joinName').value});enter(j.room,j.token)}catch(e){err(e.message)}};function enter(room,token){S.room=room;S.token=token;history.replaceState(null,'','/?room='+room);show('lobby');poll();S.poll=setInterval(poll,600)}
async function poll(){if(!S.room)return;try{const r=await fetch(`/api/state?room=${encodeURIComponent(S.room)}&token=${encodeURIComponent(S.token)}`,{cache:'no-store'});const st=await r.json();if(!r.ok)throw new Error(st.error);S.state=st;render(st)}catch(e){$('status').textContent=e.message}}
function render(st){if(!st.started){show('lobby');$('lobbyCode').textContent=st.room;$('shareLink').value=location.origin+'/?room='+st.room;$('lobbyPlayers').innerHTML=st.players.map((p,i)=>`<div class="lobbyRow"><b>${i===0?'👑 ':''}${p.name}</b><span>${i+1}/${st.max_players}</span></div>`).join('');$('startBtn').classList.toggle('hidden',st.me!==0);$('startBtn').disabled=st.players.length!==st.max_players;$('lobbyHint').textContent=st.players.length===st.max_players?'Все на месте. Можно запускать.':`Ждём игроков: ${st.players.length}/${st.max_players}`;return}show('game');$('scoreboard').innerHTML=st.players.map((p,i)=>`<div class="player ${st.current===i&&!st.round_over?'active':''}"><b>${i===st.me?'😎':'🙂'} ${p.name}</b><div>${p.cards} карт</div><div style="font-size:24px;color:var(--gold);font-weight:1000">${p.score}</div></div>`).join('');$('myName').textContent=st.players[st.me].name;$('deckCount').textContent=st.deck_count;$('topCard').innerHTML=st.top?card(st.top):'';$('series').innerHTML=st.series.length>1?st.series.map(c=>`<span class="miniCard ${red(c)?'red':''}">${rank(c)}${sym[suit(c)]}</span>`).join(''):'';$('orderedSuit').innerHTML=st.active_suit?`<div class="ordered">Заказана масть ${sym[st.active_suit]}</div>`:'';const opp=st.players.filter((_,i)=>i!==st.me).slice(0,3);$('opps').innerHTML=opp.map(p=>`<div class="opp"><b>🙂 ${p.name}</b><div class="backs">${Array.from({length:Math.min(p.cards,8)},()=>'<div class="back"></div>').join('')}</div></div>`).join('');const legal=new Set(st.legal);$('hand').innerHTML='';st.hand.forEach(c=>{const w=document.createElement('div');w.innerHTML=card(c,legal.has(c)?'legal':'');const n=w.firstElementChild;if(legal.has(c))n.onclick=()=>act('/api/play',{card:c});$('hand').appendChild(n)});const mine=st.current===st.me&&!st.round_over&&!st.match_over;const a=st.action;$('endBtn').disabled=!(mine&&a&&a.player===st.me&&a.cards.length&&!a.forced_six&&!st.pending_bridge&&!st.awaiting_suit);$('drawBtn').disabled=!(mine&&!st.pending_bridge&&!st.awaiting_suit&&st.legal.length===0&&a&&(!a.cards.length||a.forced_six));$('status').textContent=st.round_over?'Раунд окончен':mine?(a&&a.forced_six?'Твоя шестёрка: закрой той же мастью или ещё одной 6.':'Твой ход'):`Ходит ${st.players[st.current].name}`;$('log').innerHTML=st.log.map(x=>`<div>${x.msg}</div>`).join('');decision(st)}
function decision(st){const box=$('decision');if(st.pending_bridge){box.classList.remove('hidden');$('decisionTitle').textContent='🌉 БРИДЖ?';$('decisionBody').innerHTML='<div class="row"><button class="btn green" id="yesBridge">Объявить БРИДЖ</button><button class="btn" id="noBridge">Играть дальше</button></div>';setTimeout(()=>{$('yesBridge').onclick=()=>act('/api/bridge',{declare:true});$('noBridge').onclick=()=>act('/api/bridge',{declare:false})},0);return}if(st.awaiting_suit){box.classList.remove('hidden');$('decisionTitle').textContent='Валет: выбери масть';$('decisionBody').innerHTML='<div class="row">'+['H','D','C','S'].map(s=>`<button class="btn" data-suit="${s}" style="font-size:28px">${sym[s]}</button>`).join('')+'</div>';setTimeout(()=>document.querySelectorAll('[data-suit]').forEach(b=>b.onclick=()=>act('/api/suit',{suit:b.dataset.suit})),0);return}if(st.round_over){box.classList.remove('hidden');const x=st.round_summary;let rows=x.deltas.map((d,i)=>`<span>${st.players[i].name}</span><b>${d>=0?'+':''}${d} → ${x.totals[i]}${x.resets[i]?' (110→0)':''}</b>`).join('');$('decisionTitle').textContent=x.game_over?'🏆 Партия окончена':'Раунд окончен';$('decisionBody').innerHTML=`<div class="summary">${rows}</div>${st.me===0?`<button class="btn gold" id="roundNext">${x.game_over?'Новая партия':'Следующий раунд'}</button>`:'<div class="hint">Ждём хозяина комнаты…</div>'}`;if(st.me===0)setTimeout(()=>$('roundNext').onclick=()=>act(x.game_over?'/api/new_match':'/api/next_round',{}),0);return}box.classList.add('hidden')}
async function act(path,extra){try{await api(path,{room:S.room,token:S.token,...extra});await poll()}catch(e){alert(e.message)}}$('startBtn').onclick=()=>act('/api/start',{});$('endBtn').onclick=()=>act('/api/end',{});$('drawBtn').onclick=()=>act('/api/draw',{});const qp=new URLSearchParams(location.search).get('room');if(qp){$('joinTab').click();$('roomCode').value=qp.toUpperCase()}
</script></body></html>
