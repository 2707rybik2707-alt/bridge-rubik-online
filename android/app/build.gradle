plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bridgerubik.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bridgerubik.game.mobile66'
        minSdk 23
        targetSdk 35
        versionCode 66
        versionName '0.66-mobile'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
