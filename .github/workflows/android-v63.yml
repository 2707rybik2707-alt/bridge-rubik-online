name: Build and test BridgeRubik Android v66

on:
  workflow_dispatch:
  push:
    branches: [ android-mobile ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare game asset
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html

      - name: Build debug APK with Android Gradle Plugin
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon clean assembleDebug

      - name: Verify package and signature
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.bridgerubik.game.mobile66'" apk-badging.txt
          grep -q "launchable-activity: name='com.bridgerubik.game.MainActivity'" apk-badging.txt

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk | tee adb-install.txt
            grep -q "Success" adb-install.txt
            adb shell pm list packages | grep -q "package:com.bridgerubik.game.mobile66"
            adb shell monkey -p com.bridgerubik.game.mobile66 -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.bridgerubik.game.mobile66 | tee app-pid.txt
            test -s app-pid.txt
            adb exec-out screencap -p > android-launch.png
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tee resumed-activity.txt || true
            adb logcat -d -t 500 > android-logcat.txt
            ! grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|Unable to instantiate activity|ClassNotFoundException" android-logcat.txt

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: BridgeRubik-v66-EMULATOR-TESTED-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload emulator evidence
        uses: actions/upload-artifact@v4
        with:
          name: BridgeRubik-v66-emulator-evidence
          path: |
            android-launch.png
            adb-install.txt
            app-pid.txt
            resumed-activity.txt
            android-logcat.txt
            apk-badging.txt
          if-no-files-found: error

      - name: Package full local Android build toolchain
        shell: bash
        run: |
          mkdir -p local-android-toolchain/platforms/android-35
          cp -a /usr/local/lib/android/sdk/build-tools/35.0.0 local-android-toolchain/build-tools-35.0.0
          cp /usr/local/lib/android/sdk/platforms/android-35/android.jar local-android-toolchain/platforms/android-35/android.jar

      - name: Upload local Android build toolchain
        uses: actions/upload-artifact@v4
        with:
          name: Android-local-build-toolchain-35
          path: local-android-toolchain
          if-no-files-found: error
